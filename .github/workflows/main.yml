name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # NOTE: availability & reliability of windows runners may be tricky
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Test
        run: go test -v ./...

      - name: Vet
        run: go vet ./...

  build:
    needs: test
    name: Build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [amd64, arm64]
        exclude:
          # Windows on ARM64 might need special handling
          - os: windows-latest
            arch: arm64

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Build
        env:
          GOOS: ${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'darwin' || 'linux' }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p bin
          output_name="pseudoc-$GOOS-$GOARCH"
          if [ "$GOOS" = "windows" ]; then
            output_name="$output_name.exe"
          fi

          # Get build information
          VERSION=${{ github.ref_name }}
          # remove 'v' prefix if it exists
          if [[ $VERSION == v* ]]; then
            VERSION=${VERSION:1}
          fi
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          GIT_COMMIT=$(git rev-parse --short HEAD)

          # Build with ldflags to embed version info
          go build -ldflags "\
              -X 'github.com/engineervix/pseudoc/internal/version.Version=${VERSION}' \
              -X 'github.com/engineervix/pseudoc/internal/version.Date=${BUILD_TIME}' \
              -X 'github.com/engineervix/pseudoc/internal/version.Commit=${GIT_COMMIT}'" \
              -o "bin/$output_name" ./cmd/pseudoc
        shell: bash

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: pseudoc-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/pseudoc-*
          if-no-files-found: error

  release:
    if: startsWith( github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.release_info.outputs.release_name }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - uses: extractions/setup-just@v3
        with:
          just-version: 1.32.0

      - name: Generate release notes
        run: just release-notes

      - name: Set release info
        id: release_info
        run: |
          TODAY="($(TZ=Africa/Lusaka date --iso))"
          echo "release_name=${{ github.ref_name }} $TODAY" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_info.outputs.release_name }}
          body_path: ../LATEST_RELEASE_NOTES.md
          files: artifacts/**/*
